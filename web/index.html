<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="ticketForm">
        <select name="service" required>
            <option value="">Choose service...</option>
            <option value="navidrome">Navidrome</option>
            <option value="mastodon">Mastodon</option>
            <option value="matrix">Matrix</option>
            <option value="lessoci">OCI</option>
        </select>
        <input type="text" name="username" placeholder="Desired username" required>
        <input type="email" name="email" placeholder="Email (optional)">
        <textarea name="reason" placeholder="Why do you need this account?"></textarea>
        <button type="submit">Submit</button>
    </form>
    
    <script src="app.js"></script>
</body>
</html>
